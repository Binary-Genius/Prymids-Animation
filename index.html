<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeWithDiwakar | Pyramid</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #050505;
    }

    .pyramid {
      position: relative;
      width: 300px;
      height: 300px;
      transform-style: preserve-3d;
      animation: animate 8s linear infinite;
    }

    @keyframes animate {
      0% {
        transform: rotateX(-30deg) rotateY(0deg);
      }
      100% {
        transform: rotateX(-30deg) rotateY(360deg);
      }
    }

    .pyramid div {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .pyramid div span {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(#151515, #00ec00);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      transform: rotateY(calc(90deg * var(--i))) translateZ(150px) rotateX(30deg);
      transform-origin: bottom;
    }

    .pyramid .glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #00ec00;
      transform: rotateX(90deg) translateZ(-150px);
      filter: brightness(2);
      box-shadow:
        0 0 120px rgba(0, 255, 0, 0.2),
        0 0 200px rgba(0, 255, 0, 0.4),
        0 0 300px rgba(0, 255, 0, 0.6),
        0 0 400px rgba(0, 255, 0, 0.8),
        0 0 500px rgba(0, 255, 0, 1);
    }

    /* Footer Styling */
    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #888;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      line-height: 1.5;
      z-index: 10;
    }

    footer a {
      color: #00ec00;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 0 0 10px #00ec00;
    }

    footer a:hover {
      color: #fff;
      text-shadow: 0 0 15px #00ff00;
    }

  </style>
</head>

<body>

  <div class="pyramid">
    <div class="glow"></div>

    <div>
      <span style="--i: 0;"></span>
      <span style="--i: 1;"></span>
      <span style="--i: 2;"></span>
      <span style="--i: 3;"></span>
    </div>
  </div>

  <footer>
    © 2026
    <a href="https://binary-genius.github.io/CodeWithDiwakar/"
       target="_blank"
       rel="noopener noreferrer">
      CODEWITHDIWAKAR
    </a>
    <br><br>
    3D NEON PYRAMID EXPERIENCE
  </footer>

</body>
</html>
